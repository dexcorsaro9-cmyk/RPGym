workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - app_store_connect
      node: "22"
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets (dist/)
        script: node build.js

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          echo "CFBundleVersion → $BUILD_NUMBER"

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files \
            com.antoniodecino.heroscape \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Resolve SPM dependencies
        script: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace ios/App/App.xcworkspace \
            -scheme App

      - name: Build & export IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
