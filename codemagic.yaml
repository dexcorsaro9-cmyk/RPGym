workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      groups:
        - app_store_connect
      node: "22"
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets (dist/)
        script: node build.js

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          echo "CFBundleVersion → $BUILD_NUMBER"

      - name: Setup code signing
        script: |
          set -e
          echo "=== keychain initialize ==="
          keychain initialize

          echo "=== generate private key ==="
          openssl genrsa -out /tmp/dist_cert.key 2048

          echo "=== certificates create ==="
          mkdir -p ~/Library/MobileDevice/Certificates
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/dist_cert.key \
            --certificates-dir ~/Library/MobileDevice/Certificates \
            --save || echo "Certificate creation skipped (may already exist)"

          echo "=== keychain add-certificates ==="
          keychain add-certificates

          echo "=== fetch-signing-files ==="
          app-store-connect fetch-signing-files com.antoniodecino.heroscape \
            --type IOS_APP_STORE \
            --create \
            --save

          echo "=== profiles downloaded ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles directory"

          echo "=== use-profiles ==="
          xcode-project use-profiles

          echo "=== PROVISIONING_PROFILE in pbxproj ==="
          grep PROVISIONING_PROFILE ios/App/App.xcodeproj/project.pbxproj | head -5 || true

      - name: Build & Archive
        script: |
          set -e
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/HerosPace.xcarchive \
            | xcpretty

      - name: Export IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
