workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.antoniodecino.heroscape
      vars:
        BUNDLE_ID: com.antoniodecino.heroscape
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: "20"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Build web assets
        script: node build.js

      - name: Add/sync iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set bundle version
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --pre-release-version 1.0.0 2>/dev/null || echo "0")
          agvtool new-version -all $((BUILD_NUMBER + 1))

      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testers
      email:
        recipients:
          - 9corsaro9@gmail.com
        notify:
          success: true
          failure: true
