workflows:
  android-release:
    name: Android → AAB firmato (nessuna pubblicazione automatica)
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: com.antoniodecino.heroscape
      node: "22"
      java: 21
      groups:
        - android_keystore   # definisci questo gruppo nei Codemagic Environment Variables:
                              # CM_KEYSTORE (file, la .jks codificata), CM_KEYSTORE_PASSWORD,
                              # CM_KEY_ALIAS, CM_KEY_PASSWORD
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Build web assets
        script: node build.js

      - name: Sync Android platform
        script: npx cap sync android

      - name: Decode keystore e crea keystore.properties
        script: |
          mkdir -p $CM_BUILD_DIR/android/keystore
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/keystore/heropace-upload.jks
          cat > $CM_BUILD_DIR/android/keystore.properties <<EOF
          storeFile=keystore/heropace-upload.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Build AAB firmato
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    # Nessuna sezione "publishing" verso Google Play: l'AAB resta solo come
    # artifact scaricabile — l'upload sulla track (test interno/chiuso/produzione)
    # va fatto manualmente da Play Console, quando decidi tu.
    publishing:
      email:
        recipients:
          - 9corsaro9@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.antoniodecino.heroscape
      vars:
        BUNDLE_ID: com.antoniodecino.heroscape
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: "22"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Build web assets
        script: node build.js

      - name: Add/sync iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set bundle version
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --pre-release-version 1.0.0 2>/dev/null || echo "0")
          agvtool new-version -all $((BUILD_NUMBER + 1))

      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testers
      email:
        recipients:
          - 9corsaro9@gmail.com
        notify:
          success: true
          failure: true
