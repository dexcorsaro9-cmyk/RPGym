name: Deploy to Capgo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: node build.js

      - name: Deploy to Capgo
        run: npx @capgo/cli bundle upload -a ${{ secrets.CAPGO_TOKEN }} --channel production
